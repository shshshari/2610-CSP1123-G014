<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1">
    <title>MMU food recommender website</title>

    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">MMU Food Recommender</h1>
            <nav>
                <ul class="nav-list">
                  <li>Home</li>
                  <li>Search</li>
                  <li>Favourite</li>
                  <li>Review</li>
                  <li>Profile</li>
                </ul>
            </nav>

        </div>
    </header>
   
    <!--HERO SECTION-->
    <section class="hero">
        <div class="hero-section">
            <h1>Welcome to our Food Recommender System</h1>

           
            <form action="#" class="search-box">
                <input type="text" placeholder="Search 🔍">
                <button type="submit">Search</button>
            </form>

        </div>
    </section>

    <section class="stalls">
        <h1>Featured Stalls</h1>
        <div class="stall-section">
            <div class="stall-card">
                <img src="static/stall1.jpeg" alt="">
                <h2>JINJJA SHYOK</h2>
                <p>Add to Favourites</p>
            </div>
            <div class="stall-card">
                <img src="static/stall2.jpeg" alt="">
                <h2>CITA RASA</h2>
                <p>Add to Favourites</p>
            </div>
            <div class="stall-card">
                <img src="static/stall.3.jpg" alt="">
                <h2>STALL 3</h2>
                <p>Add to Favourites</p>
            </div>
            <div class="stall-card">
                <img src="static/stall.4.jpg" alt="">
                <h2>STALL 4</h2>
                <p>Add to Favourites</p>
            </div>
        </div>
    </section>
</body>
</html
