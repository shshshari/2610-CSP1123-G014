<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password – MMU Food Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forgot.css') }}">
</head>
<body>

    <!-- Top navbar -->
    <div class="top-bar">
        <a href="{{ url_for('index') }}" class="site-name">🍽️ MMU Food Recommender</a>
    </div>

    <div class="card">

        <div class="icon-circle">🔐</div>
        <h1>Forgot Password?</h1>
        <p class="subtitle">
            No worries! Enter your registered email and<br>
            we'll send you a verification code.
        </p>

        <!-- Step indicator: Step 1 of 3 -->
        <div class="steps">
            <div class="step-dot active">1</div>
            <div class="step-line"></div>
            <div class="step-dot">2</div>
            <div class="step-line"></div>
            <div class="step-dot">3</div>
        </div>

        <!-- DYNAMIC: show error message from backend if email not found -->
        {% if error %}
        <div class="flash">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="e.g. aisha@student.mmu.edu.my"
                value="{{ prefill or '' }}"
                required
            />
            <button type="submit" class="btn-primary">Send Verification Code →</button>
        </form>

        <a href="{{ url_for('login') }}" class="back-link">← Back to Sign In</a>

    </div>

</body>
</html>
