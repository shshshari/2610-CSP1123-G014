<h2>Explore MMU Stalls</h2>

<form action="{{ url_for('explore') }}" method="GET">
    <div class="form-group">
        <input type="text" name="search" placeholder="Search stall names (e.g., He & She)..." value="{{ request.args.get('search', '') }}">
    </div>

    <div class="form-group">
        <button type="submit">Apply Search & Filters</button>
        <a href="{{ url_for('explore') }}"><button type="button">Clear All</button></a>
    </div>
    <select name="category">
        <option value="">All Categories</option>
        {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
    </select>

    <select name="location">
        <option value="">All Locations</option>
        {% for loc in locations %}
            <option value="{{ loc.id }}">{{ loc.name }}</option>
        {% endfor %}
    </select>
    <button type="submit">Filter</button>
</form>

<ul>
    {% for stall in stalls %}
        <li><strong>{{ stall.name }}</strong> ({{ stall.category }}) - {{ stall.place.name }}</li>
    {% else %}
        <p>No stalls found matching those filters.</p>
    {% endfor %}
</ul>
