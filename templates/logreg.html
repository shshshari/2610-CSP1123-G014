<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Form</title>
    <!-- Use a direct absolute path to static so your CSS loads via Flask -->
    <link rel="stylesheet" href="/static/style3.css">
</head>
<body>
    <div class="container" id="container">

        <!-- SIGN UP FORM -->
        <div class="form-container sign-up">
            <!-- Added POST and action="/register" -->
            <form method="POST" action="/register">
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#"></a>
                </div>
                
                <!-- Added name attributes -->
                <input type="text" name="name" placeholder="Name">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <!-- Added type="submit" -->
                                 <!-- ROLE SELECTION -->
                <div class="role-select">
                    <label>Manager Key</label>
                    <span>only if you are a manager</span>
                    <input type="text" name="secret_code" placeholder="manager key code">
                
                </div>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- SIGN IN FORM -->
        <div class="form-container sign-in">
            <!-- Added POST and action="/login" -->
            <form method="POST" action="/login">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#"></a>
                </div>
                <span>use email and password</span>
                <!-- Added name attributes -->
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <!-- Pointed forgot password to the correct route -->
                <a href="/forgot_password">Forgot your password?</a>
                <!-- Added type="submit" -->
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- TOGGLE PANEL (Untouched) -->
        <div class="toggle-container">
            <div class="toggle">

                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>

                <div class="toggle-panel toggle-right">
                    <h1>Hello!</h1>
                    <p>Register your personal details</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>

            </div>
        </div>

    </div>
    <!-- Pointed back button to home route -->
    <a href="/" class="back-home">← Back to Home</a>
 
    <script>
        const container = document.getElementById('container');
        const registerBtn = document.getElementById('register');
        const loginBtn = document.getElementById('login');
 
        registerBtn.addEventListener('click', () => {
            container.classList.add('active');
        });
 
        loginBtn.addEventListener('click', () => {
            container.classList.remove('active');
        });
    </script>
 
</body>
</html>
