<h2>Your Registered Stalls</h2>
<ul>
    {% for stall in stalls %}
      <li>
        <strong>{{ stall.name }}</strong> - {{ stall.location }} ({{stall.category}})
        <p>{{ stall.description }}</p>
      </li>
      <td>
    <form action="{{ url_for('delete_stall', stall_id=stall.id) }}" method="POST" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this stall?')" style="color: red;">
            Delete
        </button>
    </form>
      </td>
    {% else %}
    <li>No stalls registered yet. <a href="{{ url_for('add_stall') }}">Add one.</a></li>
    {% endfor %}
</ul>
