<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px;">

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background: #f8d7da; color: #721c24; padding: 10px; max-width: 400px; margin: 0 auto 15px; border-radius: 4px;">
            {% for m in messages %}<p style="margin:0;">{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border: 1px solid #ddd; border-radius: 8px;">
        <h2 style="color: #1c4273; margin-top:0;">Reset Password</h2>

        {% if not code_sent %}
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <input type="hidden" name="action" value="send_code">
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Gmail Address:</label>
                    <input type="email" name="email" placeholder="Enter Gmail Address" style="width:100%; padding:8px; box-sizing:border-box;" required>
                </div>
                <button type="submit" style="background:#1c4273; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Send Reset Code</button>
            </form>
        {% else %}
            <p>Code generated for: <strong>{{ email }}</strong></p>
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <input type="hidden" name="action" value="verify_code">
                <input type="hidden" name="email" value="{{ email }}">
                
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">6-Digit Code:</label>
                    <input type="text" name="code" placeholder="Enter 6-Digit Code" maxlength="6" style="width:100%; padding:8px; box-sizing:border-box;" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">New Password:</label>
                    <input type="password" name="new_password" placeholder="Enter New Password" style="width:100%; padding:8px; box-sizing:border-box;" required>
                </div>

                <button type="submit" style="background:#27ae60; color:white; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Reset Password</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
